<div class="app-chili">

  <header class="main-header">
    <div class="header-content">
      <a href="/" class="logo">
        <img src="logo.svg" alt="Logo Chili Gummies" class="logo-icon">
        <span class="logo-text"> Chili Gummies</span>
      </a>

      <div class="search-content">
        <img src="Search.svg" alt="Search icono" class="search-icon">
        <input type="search" placeholder="Gomitas..." [(ngModel)]="searchQuery" (input)="onSearchChange()">
      </div>

      <app-shopping-cart-sheet [items]="cartItems" [isOpen]="isCartOpen" (isOpenChange)="isCartOpen = $event">
      </app-shopping-cart-sheet>
    </div>
  </header>

  <app-welcome></app-welcome>
  <app-categories></app-categories>
  <app-footer></app-footer>

</div>
